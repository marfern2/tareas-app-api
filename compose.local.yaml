name: tareas-app-api-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: tareas-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tareas-postgres-local-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    networks: [tareas-local-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tareas-app-api:local
    container_name: tareas-api-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tareas-app-local}
      JWT_ADMIN_ISSUER: ${JWT_ADMIN_ISSUER:-http://localhost:8080}
      JWT_ADMIN_AUDIENCE: ${JWT_ADMIN_AUDIENCE:-donit-admin-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks: [tareas-local-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  tareas-postgres-local-data:

networks:
  tareas-local-network:
    driver: bridge
