# Configuracion SOLO para tests. Secretos de prueba, nunca de produccion.
jwt.secret=dGFyZWFzLWFwcC10ZXN0LXNlY3JldC1nZW5lcmljby0yMDI2LXBhcmEtdGVzdHMtdW5pdGFyaW9z
jwt.expiration=86400000
jwt.refresh-expiration-days=30
jwt.issuer=https://donit-api.marfern.dev
jwt.audience=tareas-app

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway desactivado en tests H2: las migraciones son DDL PostgreSQL y se validan
# con Testcontainers PostgreSQL (ver FlywayPostgresqlTest / FlywayBaselineScenarioTest).
spring.flyway.enabled=false

# Desactivado en tests para no interferir con las pruebas de autorizacion
app.rate-limit.enabled=false

logging.level.com.tareas.app=WARN
