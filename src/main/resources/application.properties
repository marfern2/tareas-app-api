# Nombre de como se va a llamar la app desde este proyecto de intellij
spring.application.name=tareas-app

# Configuracion de H2 (solo desarrollo local)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway desactivado en desarrollo: las migraciones son DDL PostgreSQL y H2 no las soporta.
# En el perfil prod se activa en el PR de transicion (baseline + validate).
spring.flyway.enabled=false

# Configuracion de la consola H2 (solo dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.cors.allowed-origins=http://localhost:4200
app.h2-console.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# Configuracion de Logs
# ===============================
logging.level.com.tareas.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Guardar logs en archivo
logging.file.name=logs/tareas-app.log
logging.file.path=logs

# Formato de los logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Rotacion de archivos (opcional)
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# ===============================
# Configuracion JWT
# ===============================

# El secreto NUNCA debe ir hardcodeado en el codigo ni en este repositorio.
# Se lee desde la variable de entorno JWT_SECRET (Base64, minimo 32 bytes).
# En desarrollo local:
#   export JWT_SECRET=$(openssl rand -base64 64)
# Y arranca con:  ./gradlew bootRun
jwt.secret=${JWT_SECRET}

# Tiempo de expiracion del access token (milisegundos)
# 1800000 = 30 minutos. Vida corta: la sesion se renueva con el refresh token.
jwt.expiration=${JWT_EXPIRATION:1800000}

# Tiempo de vida del refresh token (dias)
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Emisor y audiencia del token (validados al verificar la firma)
jwt.issuer=${JWT_ISSUER:https://donit-api.marfern.dev}
jwt.audience=${JWT_AUDIENCE:tareas-app}

# ===============================
# Manejo de errores en produccion
# ===============================
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Limites de peticiones HTTP (proteccion ante abuso)
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
