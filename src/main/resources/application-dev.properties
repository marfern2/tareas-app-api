spring.config.import=classpath:application-runtime.properties
spring.application.name=tareas-app-dev
server.forward-headers-strategy=framework
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://admin-dev.marfern.dev}
jwt.issuer=${JWT_ISSUER:https://donit-api-dev.marfern.dev}
jwt.audience=${JWT_AUDIENCE:tareas-app-dev}
jwt.admin.issuer=${JWT_ADMIN_ISSUER:https://donit-api-dev.marfern.dev}
jwt.admin.audience=${JWT_ADMIN_AUDIENCE:donit-admin-dev}
app.dev.seed.enabled=${DEV_SEED_ENABLED:false}
app.dev.seed.admin-username=${DEV_ADMIN_USERNAME:}
app.dev.seed.admin-email=${DEV_ADMIN_EMAIL:}
app.dev.seed.admin-password=${DEV_ADMIN_PASSWORD:}
app.dev.seed.demo-username=${DEV_DEMO_USERNAME:}
app.dev.seed.demo-email=${DEV_DEMO_EMAIL:}
app.dev.seed.demo-password=${DEV_DEMO_PASSWORD:}
app.dev.seed.user-password=${DEV_USER_PASSWORD:}
