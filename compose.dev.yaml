name: tareas-app-api-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: tareas-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tareas-postgres-dev-data:/var/lib/postgresql/data
    networks: [tareas-dev-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    image: ghcr.io/marfern2/tareas-app-api:${API_IMAGE_TAG:-develop}
    container_name: tareas-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-https://donit-api-dev.marfern.dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tareas-app-dev}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_ADMIN_EXPIRATION: ${JWT_ADMIN_EXPIRATION:-1800000}
      JWT_ADMIN_REFRESH_EXPIRATION_DAYS: ${JWT_ADMIN_REFRESH_EXPIRATION_DAYS:-7}
      JWT_ADMIN_ISSUER: ${JWT_ADMIN_ISSUER:-https://donit-api-dev.marfern.dev}
      JWT_ADMIN_AUDIENCE: ${JWT_ADMIN_AUDIENCE:-donit-admin-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://admin-dev.marfern.dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_DEMO_USERNAME: ${DEV_DEMO_USERNAME:-}
      DEV_DEMO_EMAIL: ${DEV_DEMO_EMAIL:-}
      DEV_DEMO_PASSWORD: ${DEV_DEMO_PASSWORD:-}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080"
    networks: [tareas-dev-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  tareas-postgres-dev-data:

networks:
  tareas-dev-network:
    driver: bridge
